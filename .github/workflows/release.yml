name: Release Windows build

# Releases are explicit and reproducible: create and push a version tag such
# as v1.0.3 after updating admin_dashboard/package.json to 1.0.3.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch: {}

# Only one release build at a time - two pushes to admin_dashboard/ close
# together would otherwise race on the version-bump commit below (the
# second run's `git push` failing against the first run's already-pushed
# bump). Queues instead of running concurrently.
concurrency:
  group: release-windows-build
  cancel-in-progress: false

permissions:
  contents: write # electron-builder creates the matching GitHub Release and uploads its assets

jobs:
  build-and-publish:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: admin_dashboard
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Verify tag matches desktop version
        run: |
          $tagVersion = '${{ github.ref_name }}'.TrimStart('v')
          $packageVersion = node -p "require('./package.json').version"
          if ($tagVersion -ne $packageVersion) {
            throw "Tag v$tagVersion does not match package.json version $packageVersion."
          }

      - name: Build and publish to GitHub Releases
        run: npm run release:win
        env:
          # electron-builder's GitHub provider reads this automatically -
          # GITHUB_TOKEN is provided by Actions itself, scoped to this repo
          # only for the duration of this run. No manual token setup needed.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
