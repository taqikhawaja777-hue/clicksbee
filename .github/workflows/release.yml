name: Release Windows build

# Releases are explicit and reproducible: create and push a version tag such
# as v1.0.3 after updating admin_dashboard/package.json to 1.0.3.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch: {}

# Only one release build at a time - two pushes to admin_dashboard/ close
# together would otherwise race on the version-bump commit below (the
# second run's `git push` failing against the first run's already-pushed
# bump). Queues instead of running concurrently.
concurrency:
  group: release-windows-build
  cancel-in-progress: false

permissions:
  contents: write # electron-builder creates the matching GitHub Release and uploads its assets

jobs:
  build-and-publish:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: admin_dashboard
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - run: npm ci

      - name: Verify tag matches desktop version
        run: |
          $tagVersion = '${{ github.ref_name }}'.TrimStart('v')
          $packageVersion = node -p "require('./package.json').version"
          if ($tagVersion -ne $packageVersion) {
            throw "Tag v$tagVersion does not match package.json version $packageVersion."
          }

      - name: Build app
        run: npm run build:all

      # Build locally first and publish in one separate step: electron-builder's
      # own parallel uploads once split v1.0.8's files across two draft
      # releases, so the published one had no installer or latest.yml.
      - name: Package installer
        run: node scripts/run-electron-builder.js --win --publish never "-c.directories.output=release-ci"

      - name: Verify all release files exist
        run: |
          $v = node -p "require('./package.json').version"
          $files = @(
            "release-ci/latest.yml",
            "release-ci/WorkTrackPro-Setup-$v.exe",
            "release-ci/WorkTrackPro-Setup-$v.exe.blockmap",
            "release-ci/WorkTrackPro-$v.exe"
          )
          foreach ($f in $files) { if (-not (Test-Path $f)) { throw "Missing release file: $f" } }
          if (-not (Select-String -Path "release-ci/latest.yml" -Pattern "url: WorkTrackPro-Setup-$v.exe" -SimpleMatch -Quiet)) {
            throw "latest.yml does not reference WorkTrackPro-Setup-$v.exe"
          }
          Get-Content release-ci/latest.yml

      # Created as a DRAFT with every file attached in one step - the owner
      # reviews and clicks "Publish release" on GitHub. Installed apps only
      # see the update (latest.yml) once it is published.
      - name: Create draft GitHub Release
        run: |
          $v = node -p "require('./package.json').version"
          gh release create "v$v" `
            "release-ci/latest.yml" `
            "release-ci/WorkTrackPro-Setup-$v.exe" `
            "release-ci/WorkTrackPro-Setup-$v.exe.blockmap" `
            "release-ci/WorkTrackPro-$v.exe" `
            --title "$v" --notes "WorkTrackPro $v" --verify-tag --draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
