<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>StitchMonitor - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f0f4ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }
    /* Decorative blurs */
    .blur-1 {
      position: absolute; top: -20%; left: -10%;
      width: 50vw; height: 50vw; border-radius: 50%;
      background: rgba(180, 197, 255, 0.25); filter: blur(120px);
      pointer-events: none;
    }
    .blur-2 {
      position: absolute; bottom: -20%; right: -10%;
      width: 40vw; height: 40vw; border-radius: 50%;
      background: rgba(211, 228, 254, 0.4); filter: blur(100px);
      pointer-events: none;
    }
    .card {
      position: relative; z-index: 1;
      width: 100%; max-width: 480px;
      background: #fff; border-radius: 20px;
      border: 1px solid rgba(195, 198, 215, 0.3);
      box-shadow: 0 10px 40px -10px rgba(0,0,0,0.08);
      padding: 40px;
      display: flex; flex-direction: column; gap: 32px;
    }
    .card-header { text-align: center; }
    .logo-box {
      width: 48px; height: 48px; border-radius: 12px;
      background: linear-gradient(135deg, #004ac6, #2563eb);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 12px; box-shadow: 0 4px 12px rgba(0,74,198,0.25);
    }
    .logo-box .material-symbols-outlined { color: #fff; font-size: 28px; }
    h1 { font-size: 28px; font-weight: 700; color: #0b1c30; }
    .card-header p { font-size: 14px; color: #737686; margin-top: 4px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 12px; font-weight: 600; color: #0b1c30; letter-spacing: 0.04em; }
    .form-group select,
    .form-group input {
      width: 100%; border: 1px solid #c3c6d7;
      background: #f8f9ff; color: #0b1c30;
      font-family: 'Inter', sans-serif; font-size: 14px;
      border-radius: 10px; padding: 12px 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }
    .form-group select:focus,
    .form-group input:focus {
      border-color: #004ac6;
      box-shadow: 0 0 0 3px rgba(0,74,198,0.12);
    }
    .input-wrapper { position: relative; }
    .input-wrapper .toggle-pw {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: #737686;
      padding: 4px;
    }
    .input-wrapper .toggle-pw:hover { color: #0b1c30; }
    .row-between { display: flex; align-items: center; justify-content: space-between; }
    a.link { font-size: 12px; font-weight: 600; color: #004ac6; text-decoration: none; }
    a.link:hover { color: #003ea8; }
    .remember-row { display: flex; align-items: center; gap: 8px; }
    .remember-row input[type=checkbox] {
      width: 16px; height: 16px; accent-color: #004ac6; cursor: pointer;
    }
    .remember-row label { font-size: 14px; color: #737686; cursor: pointer; }
    .btn-primary {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, #004ac6, #2563eb);
      color: #fff; border: none; border-radius: 10px;
      font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all 0.2s; box-shadow: 0 4px 14px rgba(0,74,198,0.3);
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,74,198,0.4); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .btn-primary .material-symbols-outlined { font-size: 18px; }
    .signup-link { text-align: center; font-size: 14px; color: #737686; }
    .signup-link a { color: #004ac6; font-weight: 600; text-decoration: none; }
    .signup-link a:hover { color: #003ea8; }
    .footer-terms {
      margin-top: auto; text-align: center;
      border-top: 1px solid rgba(195,198,215,0.3); padding-top: 20px;
    }
    .footer-terms p { font-size: 11px; color: rgba(115,118,134,0.7); }
    .footer-terms a { color: inherit; text-decoration: underline; }
    .footer-terms a:hover { color: #737686; }
    /* Toast */
    .toast {
      position: fixed; top: 24px; right: 24px; z-index: 100;
      padding: 14px 20px; border-radius: 12px;
      font-size: 14px; font-weight: 500;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      transform: translateX(120%); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
    }
    .toast.show { transform: translateX(0); }
    .toast.success { background: #065f46; color: #d1fae5; }
    .toast.error { background: #991b1b; color: #fecaca; }
    /* Spinner */
    .spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* Back link */
    .back-link {
      position: fixed; top: 24px; left: 24px; z-index: 10;
      display: flex; align-items: center; gap: 6px;
      font-size: 13px; font-weight: 600; color: #004ac6;
      text-decoration: none; padding: 8px 14px;
      background: rgba(255,255,255,0.8); border-radius: 9999px;
      border: 1px solid rgba(195,198,215,0.3);
      backdrop-filter: blur(8px);
      transition: all 0.2s;
    }
    .back-link:hover { background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  </style>
</head>
<body>
  <div class="blur-1"></div>
  <div class="blur-2"></div>

  <a href="/" class="back-link">
    <span class="material-symbols-outlined" style="font-size:18px;">arrow_back</span>
    Back to Home
  </a>

  <div id="toast" class="toast"></div>

  <div class="card">
    <div class="card-header">
      <div class="logo-box">
        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">monitoring</span>
      </div>
      <h1>StitchMonitor</h1>
      <p>Sign in to your workspace</p>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div style="display:flex;flex-direction:column;gap:16px;">
        <div class="form-group">
          <label for="role">Select Role</label>
          <select id="role" name="role">
            <option value="EMPLOYEE">Employee</option>
            <option value="MANAGER">Manager</option>
            <option value="ADMIN">Administrator</option>
          </select>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input id="email" name="email" type="email" placeholder="name@company.com" required autocomplete="email"/>
        </div>

        <div class="form-group">
          <div class="row-between">
            <label for="password">Password</label>
            <a class="link" href="javascript:void(0)" onclick="showToast('Contact your admin to reset your password', 'error')">Forgot password?</a>
          </div>
          <div class="input-wrapper">
            <input id="password" name="password" type="password" placeholder="••••••••" required autocomplete="current-password"/>
            <button type="button" class="toggle-pw" onclick="togglePassword()">
              <span id="pwIcon" class="material-symbols-outlined" style="font-size:20px;">visibility</span>
            </button>
          </div>
        </div>

        <div class="remember-row">
          <input id="remember" type="checkbox"/>
          <label for="remember">Remember me for 30 days</label>
        </div>

        <div style="display:flex;flex-direction:column;gap:12px;margin-top:8px;">
          <button type="submit" class="btn-primary" id="submitBtn">
            <span id="btnText">Sign In</span>
            <span class="material-symbols-outlined" id="btnArrow">arrow_forward</span>
          </button>
          <div class="signup-link">
            Don't have an account? <a href="/sign_up/code.html">Create an account</a>
          </div>
        </div>
      </div>
    </form>

    <div class="footer-terms">
      <p>
        By signing in, you agree to the <a href="javascript:void(0)">Terms of Service</a> and <a href="javascript:void(0)">Privacy Policy</a>.
      </p>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:3000/api/v1';

    function togglePassword() {
      const pw = document.getElementById('password');
      const icon = document.getElementById('pwIcon');
      if (pw.type === 'password') {
        pw.type = 'text';
        icon.textContent = 'visibility_off';
      } else {
        pw.type = 'password';
        icon.textContent = 'visibility';
      }
    }

    function showToast(msg, type) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast ' + type + ' show';
      setTimeout(() => { t.classList.remove('show'); }, 3500);
    }

    function setLoading(loading) {
      const btn = document.getElementById('submitBtn');
      const text = document.getElementById('btnText');
      const arrow = document.getElementById('btnArrow');
      if (loading) {
        btn.disabled = true;
        text.textContent = 'Signing in...';
        arrow.style.display = 'none';
        const sp = document.createElement('span');
        sp.className = 'spinner';
        sp.id = 'loadSpinner';
        btn.appendChild(sp);
      } else {
        btn.disabled = false;
        text.textContent = 'Sign In';
        arrow.style.display = '';
        const sp = document.getElementById('loadSpinner');
        if (sp) sp.remove();
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showToast('Please fill in all fields', 'error');
        return;
      }

      setLoading(true);

      try {
        const res = await fetch(API_BASE + '/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok && data.data) {
          // Store auth tokens
          localStorage.setItem('access_token', data.data.accessToken || data.data.access_token || '');
          localStorage.setItem('refresh_token', data.data.refreshToken || data.data.refresh_token || '');
          localStorage.setItem('user', JSON.stringify(data.data.user || {}));

          showToast('Login successful! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = '/admin_dashboard/code.html';
          }, 1000);
        } else {
          showToast(data.message || data.error || 'Invalid email or password', 'error');
        }
      } catch (err) {
        showToast('Cannot connect to server. Is the backend running on port 3000?', 'error');
        console.error('Login error:', err);
      } finally {
        setLoading(false);
      }
    }
  </script>
</body>
</html>
