version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stitch_monitor_backend
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=mongodb://mongo:27017/stitchmonitor?authSource=admin
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super-secret-jwt-access-key-stitchmonitor-2026
      - PORT=3000
      - NODE_ENV=production
    depends_on:
      - mongo
      - redis
    restart: always

  mongo:
    image: mongo:6.0
    container_name: stitch_monitor_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  redis:
    image: redis:7-alpine
    container_name: stitch_monitor_redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  mongo_data:
